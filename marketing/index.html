<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papercase store graphics</title>
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span id="logo"></span>
    <div>
      <h1>Papercase store graphics</h1>
      <p>Google Play feature graphic and screenshots for phone and tablet. Click any headline to edit it; edits are kept in this browser.</p>
    </div>
  </div>
  <div class="actions">
    <button id="dl-all" class="primary">Download everything (.zip)</button>
    <button id="reset-edits">Reset edits</button>
  </div>
</header>

<main id="sets"></main>
<div id="toast" class="toast"></div>

<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
